<!DOCTYPE html>
<html>

    <head>
        <title>Fathi's Biodata</title>
        <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
    
        <style>
            body { 
                font-family: "Baloo 2", sans-serif; 
                background-color: #0F172A;
                text-align: center;
            }
        
            h1 { 
                color: #60A5FA;
                font-size: 50px;
                text-align: center;
                margin-bottom: -20px;
            }
            
            .sub {
                color: #A78BFA;
                font-size: 25px;
                margin-bottom: 100px;
            }

            p { 
                color: #CBD5E1;
                font-size: 20px;
                margin-bottom: 40px;
            }

            .profile-card {
                background-color: #1E293B;
                width: 700px;
                padding: 30px;
                border-radius: 25px;
                border: 1px solid #334155; 
                margin: auto;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            }

            .about {
                display:flex;
                align-items: center;
                gap: 30px;
            }

            .profile-photo {
                width: 150px;
                height: 150px;
                border-radius: 50%;
                background-color: #334155;

                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 60px;
            }

            .info { 
                text-align: left;
            }
           
            hr {
                border: none;
                border-top: 3px solid #334155;
                margin: 30px 0;
            }

            .hobbies {
                margin-top:20px;
                margin-bottom:30px;
            
            }
            .hobbies h2 {
                color: #60A5FA;
                margin-bottom: 25px;    
            }
            .hobby-list { 
                display: flex;
                gap: 30px;
                justify-content: center;
                align-items: center;
            }
            .hobby-list p {
                background-color: #334155;
                padding: 15px;
                border: 1px solid #475569;
                border-radius: 15px;
                margin: 0;
                width: 150px;
                text-align: center;
                transition: 0.3s;
            }
            .hobby-list p:hover {
                transform: translateY(-5px);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
                cursor: pointer;
            }

            .dream-univ {
                text-align: center;
                margin-bottom: -15px;
            }
            .dream-univ img {
                width: 100px;
                height: 100px;
                object-fit: contain;
            }
            .dream-univ .univ-name {
                color: #CBD5E1;
                font-size: 20px;
                margin: 10px 0 0;
            }
            button { 
                background-color: #334155;
                color: #60A5FA;
                border: 1px solid #60A5FA;
                padding: 8px 28px;
                border-radius: 20px;
                font-family: "Baloo 2", sans-serif;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
                margin-bottom: 20px;
            }
            .dream-univ button:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 15px rgba(96, 165, 250, 0.3);
            }
            .univ-info {
                opacity: 0;
                transition: 0.3s;
            }

            .social-media a {
                display: inline-block;
                background-color: #334155;
                color: #CBD5E1;
                text-decoration: none;
                padding: 10px 25px;
                border-radius: 20px;
                border: 1px solid #475569;
                font-size: 18px;
                font-weight: bold;
                transition: 0.3s;
                cursor: pointer;
            }
            .social-media a:hover {
                transform: translateY(-3px) scale(1.05);
                background-color: #60A5FA;
                color: #0F172A;
                box-shadow: 0 6px 15px rgba(96, 165, 250, 0.3);
            }
            .social-media a:active {
                transform: translateY(0.95);
            }
            .social-media {
                margin-top: 20px;
                margin-bottom: 20px;
            }
        </style>
    </head>

    
    <body>
       <!--Kalimat-->
        <h1>A Little About Me</h1>
        <h2 class="sub">Get to know me a little better</h2>
    
        <!--Profile Card-->
        <div class="profile-card">
            <div class="about">

                <div class="profile-photo">
                👤
                </div>
                
                <div class="info">
                    <h2 style="color: #60A5FA;
                        font-size: 30px;
                        margin: 0;">About Me</h2>
                    <p style="font-size: 30px;
                        margin: 5px 0;">
                        Name: <strong>Fathi Raissa Rafan</strong>
                        <br> Class: <strong>XI-5</strong>
                        <br> From: <strong>SMAN 32 JAKARTA</strong>
                    </p>


                </div>
            </div>

            <hr>

            <div class="hobbies">
                <h2 style="margin-top: 20px; margin-bottom: 10px;">🏀 Hobbies</h2>
                
                <div class="hobby-list">
                    <p>🏀 <strong>Basketball</strong></p>
                    <p> 🎮 <strong>Gaming</strong></p>
                    <p> 🎸 <strong>Guitar</strong></p>
                </div>
            </div>

            <hr>
            <div class="dream-univ">
                <h2 style="color: #60A5FA">🎓 Dream University</h2>
                <button onclick="showUniversity()">Show</button>
                <div class="univ-info">
                    <img src="Lambang UGM.png">
                    <p class="univ-name"><strong>Universitas Gadjah Mada</strong></p>
                </div>  
            </div>
            
            <script> 
                function showUniversity() {
                    document.querySelector(".univ-info").style.opacity= "1";
                    document.querySelector(".dream-univ button").style.display= "none";
                }
            </script>

            <hr>

            <div class="social-media">
                <h2 style="color: #60A5FA">📱 Social Media</h2> 
                <a href="https://www.instagram.com/fthirassa?igsi=MTl4b29jaHM4NzJ5dw==" target="_blank">
                    📸 Instagram 
                </a>



            </div>

        </div>

        <footer style="color: #CBD5E1">
            <br>© 2026 - Fathi's Biodata Website
        </footer>
    </body>

</html>
